name: Probe MARA source

on:
  push:
    paths:
      - "scripts/probe_mara.py"
      - ".github/workflows/probe-mara.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_mara.py
      - uses: actions/upload-artifact@v4
        with:
          name: mara-probe
          path: mara_probe.html
